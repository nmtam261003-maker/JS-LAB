<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function laSoNguyenTo(n) {
        if (!Number.isInteger(n) || n < 2) {
            return false;
        }

        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
            return false;
            }
        }

        return true;
        }

        // Ví dụ sử dụng
        const soKiemTra = [1, 2, 7, 15, 17, 20, 97];

        soKiemTra.forEach((n) => {
        console.log(`${n} ${laSoNguyenTo(n) ? "là" : "không phải"} số nguyên tố`);
        });
    </script>
</body>
</html>
